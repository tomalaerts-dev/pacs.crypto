servers:
  - url: https://api.example-vasp.com/v1
    description: VASP-hosted Exception and Investigation API endpoint
  - url: https://example-bank.com/api/pacs-crypto/v1
    description: Bank-hosted Exception and Investigation API endpoint

tags:
  - name: Investigation
    description: |
      Operations on investigation resources covering UTAP, RQFI, RQCH,
      ACCT, and OTHR types.
  - name: Response
    description: Submission of investigation responses.
  - name: Action
    description: Follow-up actions on open investigations.
  - name: Search
    description: Discovery of historic investigation records.

paths:

  /investigation:
    post:
      tags: [Investigation]
      operationId: createInvestigation
      summary: Create a new investigation
      description: |
        Creates a new investigation request directed at a counterparty
        institution. The investigation must reference at least one underlying
        business event (instruction, Travel Rule record, or reporting entry)
        via the `references` block.

        The investigation type must be one of the supported types
        (UTAP, RQFI, RQCH, ACCT, OTHR). Investigation reason codes follow
        the filtered subset described in the spec description.

        **Idempotency:** `POST /investigation` is idempotent on
        `requestor_investigation_identification`. Safe to retry after timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Investigation'
            examples:
              utap_wallet_unmapped:
                $ref: '#/components/examples/Example_UTAP_WalletUnmapped'
              rqfi_travel_rule_supplement:
                $ref: '#/components/examples/Example_RQFI_TravelRuleSupplement'
              rqch_gas_fee_query:
                $ref: '#/components/examples/Example_RQCH_GasFeeQuery'
      responses:
        '201':
          description: Investigation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationResponse_Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: |
            Idempotent duplicate — an investigation with the same
            `requestor_investigation_identification` already exists. The
            response body contains the original `investigation_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /investigation/{investigationId}:
    get:
      tags: [Investigation]
      operationId: getInvestigation
      summary: Retrieve an investigation with its full lifecycle history
      description: |
        Returns the current state of the investigation including all
        responses and follow-up actions exchanged so far. The response
        includes a `lifecycle` array showing the sequence of state
        transitions with timestamps.

        For long-running investigations with extensive history, use
        `?lifecycle_limit=N` to cap the number of lifecycle entries
        returned. Most recent entries are returned first. The
        Investigation itself remains complete regardless of lifecycle
        pagination.
      parameters:
        - name: investigationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lifecycle_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: |
            Optional cap on the number of lifecycle entries returned.
            If omitted, the full lifecycle is returned.
      responses:
        '200':
          description: Investigation retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /investigation/{investigationId}/response:
    post:
      tags: [Response]
      operationId: submitInvestigationResponse
      summary: Submit a response to an open investigation
      description: |
        Submits a substantive response to an open investigation. The response
        may close the investigation (status transitions to `CLSD`), partially
        address it (status remains `PDNG` with `PARE` PartialResponse), or
        reject it (status transitions to `RJCT`).

        Multiple responses may be submitted across the lifecycle — for
        example, an initial partial response followed by a final closure
        response.
      parameters:
        - name: investigationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationResponseSubmission'
            examples:
              utap_corrected_creditor:
                $ref: '#/components/examples/Example_Response_UTAP_CorrectedCreditor'
              rqfi_travel_rule_supplement:
                $ref: '#/components/examples/Example_Response_RQFI_TravelRuleSupplement'
              charge_clarification:
                $ref: '#/components/examples/Example_Response_ChargeClarification'
              rejected_for_legal_reason:
                $ref: '#/components/examples/Example_Response_Rejected_Legal'
      responses:
        '201':
          description: Response recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseAcknowledgement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Investigation is already closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /investigation/{investigationId}/action:
    post:
      tags: [Action]
      operationId: submitInvestigationAction
      summary: Submit a follow-up action on an open investigation
      description: |
        Submits a follow-up action on an investigation. Three actions are
        supported, following `ExternalInvestigationAction1Code`:

        - `RQCL` RequestInvestigationClosure — the requestor asks the responder
          to close the investigation (typically because it has been resolved
          out-of-band or sent in error).
        - `RQST` RequestInvestigationStatus — the requestor asks the responder
          for the current status of an investigation that has been open longer
          than expected.
        - `RQOB` RequestObjection — the requestor objects to a previous
          response from the responder (typically because the response was
          incomplete or the compensation amount was disputed).
      parameters:
        - name: investigationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationActionSubmission'
      responses:
        '201':
          description: Action recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseAcknowledgement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /investigation/search:
    get:
      tags: [Search]
      operationId: searchInvestigations
      summary: Search this party's investigation records
      description: |
        Returns investigation records this party has originated or received,
        filtered by status, type, time window, and counterparty. Useful for
        operations dashboards, audit, and reconciliation.

        Results are paginated with cursor-based pagination. The response
        carries `next_cursor` if more results are available; pass it back
        as the `cursor` parameter on the next call. Cursors are valid for
        24 hours.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: string
            enum: [PDNG, CLSD, RJCT]
        - name: type
          in: query
          schema:
            type: string
            enum: [UTAP, RQFI, RQCH, ACCT, OTHR]
        - name: counterparty_lei
          in: query
          schema:
            type: string
            pattern: '^[A-Z0-9]{20}$'
        - name: cursor
          in: query
          schema:
            type: string
          description: |
            Pagination cursor from a previous page's `next_cursor`. Omit
            for the first page.
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSearchResponse'

components:

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Investigation not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Request well-formed but logically invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    InitiatingAIAgent:
      type: object
      description: |
        [EXTENSION — v1.4] The AI agent that initiated this action, for compliance
        disclosure. The authoritative identity attestation and mandate verification
        (including the action-class check — here, RAISE_INVESTIGATION) happen via the
        agentic binding defined in the Instruction API; this block carries the
        compliance-visible subset so the fact travels and is reportable.
      required:
        - ai_agent_identifier
        - principal
      properties:
        ai_agent_identifier:
          type: string
          maxLength: 512
          description: The agent's distinct identifier (DID or vLEI delegated id).
        ai_agent_operator:
          type: string
          maxLength: 350
          description: Optional. The party operating the agent, where it differs from the principal.
        principal:
          type: object
          description: The entity or person on whose behalf the agent acts (LEI or other scheme).
          oneOf:
            - type: object
              required: [lei]
              properties:
                lei:
                  type: string
                  pattern: '^[A-Z0-9]{18}[0-9]{2}$'
            - type: object
              required: [other_identity]
              properties:
                other_identity:
                  type: object
                  required: [scheme, identifier]
                  properties:
                    scheme:
                      type: string
                      maxLength: 50
                    identifier:
                      type: string
                      maxLength: 512
        mandate_reference:
          type: string
          maxLength: 2048
          description: The mandate under which the agent acted (must include RAISE_INVESTIGATION scope).
        human_present:
          type: boolean
          description: Whether a human approved this specific action (true) or it was fully autonomous (false).

    # ── ENUMERATIONS ──────────────────────────────────────────────────────────

    InvestigationType:
      type: string
      description: |
        Supported investigation types — filtered subset of
        `ExternalInvestigationType1Code`. See spec description for rationale.
      enum:
        - UTAP
        - RQFI
        - RQCH
        - ACCT
        - OTHR

    InvestigationStatus:
      type: string
      description: |
        Investigation lifecycle status, from `ExternalInvestigationStatus1Code`.
      enum:
        - PDNG
        - CLSD
        - RJCT

    InvestigationStatusReason:
      type: string
      description: |
        Detailed status reason, from `ExternalInvestigationStatusReason1Code`.
        Used by the responder to qualify a `PDNG`, `CLSD`, or `RJCT` status.
      enum:
        - AGNT     # IncorrectAgentOrParty
        - DU01     # DuplicateRequest
        - NARR     # Narrative
        - FTNA     # ForwardedToAgentOrParty
        - CAPR     # ClosedAsPerRequest
        - CACR     # ClosedAsCancellationRequestSent
        - ARPL     # AwaitingReplyFromCustomer
        - NOAS     # NoAnswerFromCustomer
        - INPO     # InProgress
        - ARDT     # AlreadyReturned
        - RR04     # RegulatoryReason
        - LEGL     # LegalDecision
        - ESCA     # Escalation
        - INIT     # IncorrectInvestigationType
        - PARE     # PartialResponse
        - NOAD     # NoAdditionalInformationAvailable
        - CMPI     # CorrectionMadeAsPerInquiry

    InvestigationReasonCode:
      type: string
      description: |
        Investigation reason, from `ExternalInvestigationReason1Code` filtered
        for relevance to blockchain payments, plus three proposed crypto-specific
        codes (`TRSU`, `WALV`, `ATTR`).

        **Compliance reason codes (`AMLI`, `FCCI`, `FWTR`) are deliberately
        excluded** to avoid creating a tipping-off vocabulary. See the spec
        description for the detailed rationale. Where a compliance-related
        question genuinely needs to be raised, use `RQDO` RequestDocumentation
        with a narrative.
      enum:
        # Standard ISO 20022 codes from ExternalInvestigationReason1Code
        - RERE     # RelatedReference
        - REIN     # RemittanceInformation
        - PYPU     # PaymentPurpose
        - DTOR     # Debtor
        - CTOR     # Creditor
        - INPA     # InitiatingParty
        - ULTD     # UltimateDebtor
        - ULTC     # UltimateCreditor
        - REGR     # RegulatoryReporting
        - RQDO     # RequestDocumentation
        - RQPR     # RequestPartyRelationship
        - RQSG     # RequestServicesOrGoodsDetails
        - RQED     # RequestServicesOrGoodsExchangeDate
        - RQLD     # RequestLocationDetails
        - NARR     # Narrative
        - UTAP     # UnableToApplyByCreditor
        - ACCT     # AccountRelatedInvestigation
        - RQCH     # RequestRelatedToCharges
        - CHIN     # ChargesInformation
        # pacs.crypto-proposed extensions (proprietary until registered)
        - TRSU     # TravelRuleSupplement
        - WALV     # WalletVerification
        - ATTR     # AttestationRequest

    InvestigationActionCode:
      type: string
      description: |
        Follow-up action on an open investigation, from
        `ExternalInvestigationAction1Code`.
      enum:
        - RQCL     # RequestInvestigationClosure
        - RQST     # RequestInvestigationStatus
        - RQOB     # RequestObjection

    InvestigationActionReasonCode:
      type: string
      description: |
        Reason qualifying a follow-up action, from
        `ExternalInvestigationActionReason1Code`.
      enum:
        - IRSI     # InvestigationRequestSentInError
        - IRRR     # InvestigationRequestResolved
        - IRCD     # InvestigationResponseCompensationDisputed
        - IRIC     # InvestigationResponseIncomplete
        - NARR     # Narrative

    # ── REFERENCES TO UNDERLYING BUSINESS EVENT ───────────────────────────────

    InstructionReference:
      type: object
      description: |
        Reference to a pacs.crypto Instruction API record.
      required: [instruction_id]
      properties:
        instruction_id:
          type: string
          format: uuid
        uetr:
          type: string
          format: uuid
        end_to_end_identification:
          type: string
          maxLength: 35

    TravelRuleReference:
      type: object
      description: |
        Reference to a pacs.crypto Travel Rule API record.
      required: [record_id]
      properties:
        record_id:
          type: string
          format: uuid

    ReportingReference:
      type: object
      description: |
        Reference to a transaction entry in an Account Reporting API report.
      required: [transaction_hash]
      properties:
        report_id:
          type: string
          format: uuid
        transaction_hash:
          type: string
          description: On-chain transaction hash that the investigation concerns.

    InvestigationReferences:
      type: object
      description: |
        At least one reference must be present. Multiple references are
        permitted when the investigation spans more than one underlying record.
      properties:
        instruction:
          $ref: '#/components/schemas/InstructionReference'
        travel_rule:
          $ref: '#/components/schemas/TravelRuleReference'
        reporting:
          $ref: '#/components/schemas/ReportingReference'

    # ── PARTY IDENTIFICATION (shared with rest of family) ────────────────────

    PartyIdentification:
      type: object
      description: |
        Party identification reused from pacs.008.001.14 `PartyIdentification272`.
        Same structure as in the Instruction and Travel Rule APIs.
      properties:
        name:
          type: string
          maxLength: 140
        lei:
          type: string
          pattern: '^[A-Z0-9]{20}$'
        bic:
          type: string
          pattern: '^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}([A-Z0-9]{3,3}){0,1}$'
        country:
          type: string
          pattern: '^[A-Z]{2}$'
        contact:
          type: object
          properties:
            name:
              type: string
              maxLength: 140
            email:
              type: string
              format: email
            phone:
              type: string

    # ── MAIN INVESTIGATION SCHEMA ─────────────────────────────────────────────

    Investigation:
      type: object
      description: |
        Investigation request payload. Root object for `POST /investigation`.
        Modelled on `InvestigationRequestV02` (camt.110.001.02) with field
        names adapted to API convention and the reason and type subsets
        filtered for blockchain context.
      required:
        - message_identification
        - requestor_investigation_identification
        - investigation_type
        - requestor
        - responder
        - references
      properties:
        message_identification:
          type: string
          maxLength: 35
          description: Unique identifier for this message. Maps to camt.110 `MsgId`.

        requestor_investigation_identification:
          type: string
          maxLength: 35
          description: |
            Identifier assigned by the requestor to this investigation. Used as
            the idempotency key for `POST /investigation` retries. Maps to
            camt.110 `RqstrInvstgtnId`.

        eir:
          type: string
          format: uuid
          description: |
            End-to-end Investigation Reference. UUID used to correlate all
            messages related to this investigation across all parties.
            Maps to camt.110 `EIR`.

        investigation_type:
          $ref: '#/components/schemas/InvestigationType'

        investigation_sub_type:
          type: string
          maxLength: 4
          description: |
            Optional sub-type qualifying the main type, from
            `ExternalInvestigationSubType1Code`. Example: an `OTHR` type with
            sub-type `RQCH` for a charges-related question that does not fit
            the main `RQCH` type.

        investigation_reason:
          type: object
          description: |
            Reason for the investigation. Carries the structured code plus
            optional sub-type, additional information, and narrative.
          properties:
            code:
              $ref: '#/components/schemas/InvestigationReasonCode'
            proprietary:
              type: string
              maxLength: 35
              description: |
                Proprietary reason code where no suitable enumerated code
                exists. Use issuer `pacs.crypto` for the proposed crypto-specific
                codes (`TRSU`, `WALV`, `ATTR`) until they are formally registered.
            additional_information:
              type: array
              items:
                type: string
                maxLength: 105
              maxItems: 10
              description: |
                Up to 10 lines of additional information qualifying the reason.
                Free text. Used for `OTHR` type or for narrative supplements
                to a structured reason code.
            narrative:
              type: string
              maxLength: 1000
              description: |
                Extended free text describing the investigation. Used where
                the structured codes alone do not capture the request.

        references:
          $ref: '#/components/schemas/InvestigationReferences'

        requestor:
          $ref: '#/components/schemas/PartyIdentification'

        request_originator:
          $ref: '#/components/schemas/PartyIdentification'
          description: |
            Party on whose behalf the requestor is raising the investigation,
            where the requestor is acting for an underlying customer or
            business unit. Optional. Populated when a bank or VASP raises an
            investigation for a customer; omitted when the requestor is also
            the underlying interested party (for example, a corporate raising
            directly without an intermediating bank). Anti-tipping-off
            discipline applies: populate when the underlying customer identity
            is operationally needed for the responder to answer the
            investigation; omit otherwise.

        request_originator_relationship:
          type: string
          enum: [CUSTOMER, SUBSIDIARY, BUSINESS_UNIT, WHITE_LABEL_CLIENT, OTHER]
          description: |
            Coded indication of the relationship between the requestor and
            the request_originator. Required when request_originator is
            populated.

        responder:
          $ref: '#/components/schemas/PartyIdentification'

        expected_responder:
          $ref: '#/components/schemas/PartyIdentification'
          description: |
            The institutional party the requestor expects to answer the
            investigation. Distinct from `responder` only in cases where the
            requestor expects an answer from a specific institution different
            from the one it has the bilateral relationship with — for example,
            a request for information that the requestor expects the original
            VASP partner to forward to the on-chain custodian. In most cases
            this matches `responder` and may be omitted.

        investigation_service_level:
          type: string
          enum: [R01D, R03D, R05D, R10D, R15D]
          description: |
            Expected response timeframe, from
            `ExternalInvestigationServiceLevel1Code`. Bilateral agreement may
            override.

        amount_in_question:
          type: object
          description: |
            Optional amount that the investigation concerns. Useful for
            charge-related, value-related, and reconciliation queries.
          properties:
            value:
              type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
              description: Decimal value as string (preserves precision).
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
              description: |
                ISO 4217 currency code of the underlying fiat for pegged
                stablecoins (USD for USDC, EUR for EURC, and so on). Use `XXX`
                (ISO 4217 "no currency involved") for tokens not pegged to a
                fiat currency, such as ETH, BTC, or governance tokens.
            token_dti:
              type: string
              description: |
                Optional DTI identifying the specific token when the
                investigation concerns a token-denominated amount. Provided
                in addition to `currency` (which uses XXX for non-pegged
                tokens or the fiat code for pegged tokens).

        webhook_url:
          type: string
          format: uri
          description: |
            URL to which the responder pushes `InvestigationStatusUpdate`
            notifications on status transitions. The same notification is
            also retrievable via `GET /investigation/{investigationId}`.

    InvestigationResponse_Created:
      type: object
      description: |
        Response to a successful `POST /investigation`.
      required: [investigation_id, status, accepted_at]
      properties:
        investigation_id:
          type: string
          format: uuid
        eir:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/InvestigationStatus'
        accepted_at:
          type: string
          format: date-time
        expected_response_by:
          type: string
          format: date-time

    InvestigationResponseSubmission:
      type: object
      description: |
        Response to an investigation. Submitted via
        `POST /investigation/{investigationId}/response`. Modelled on
        `InvestigationResponseV03` (camt.111.001.03) with the same
        sub-vocabulary filtering as the request. The response content is
        carried in `response_data` as a structured ResponseDataRecord
        inspired by camt.111 `InvestigationDataRecord12Choice`.
      required:
        - message_identification
        - responder_investigation_identification
        - status
      properties:
        message_identification:
          type: string
          maxLength: 35
        responder_investigation_identification:
          type: string
          maxLength: 35
          description: Identifier assigned by the responder.

        response_originator:
          $ref: '#/components/schemas/PartyIdentification'
          description: |
            Party that produced the substantive content of the response, where
            this is not the responder itself. Optional. May be the responder's
            customer, an internal team within the responder, or another party
            reached by the responder. Useful for downstream audit and
            reconciliation. Omitted when the responder produced the answer
            itself.

        status:
          $ref: '#/components/schemas/InvestigationStatus'
        status_reason:
          $ref: '#/components/schemas/InvestigationStatusReason'
        execution_confirmation:
          type: string
          maxLength: 4
          description: |
            Optional `ExternalInvestigationExecutionConfirmation1Code` value
            describing the action taken. Filtered to codes meaningful on-chain:
            CONF ConfirmationOfPayment, CHRG ChargesDetailsProvided, PURP
            PurposeDetailsProvided, INFO AdditionalInformationSent, NINF
            NoInformationAvailable, PDNG Pending.

        response_data:
          $ref: '#/components/schemas/ResponseDataRecord'

        compensation:
          type: object
          description: |
            Optional compensation indication. Used where the investigation
            concerns charges and the responder offers compensation. The
            actual compensation payment is executed through the Instruction
            API as a separate transaction.
          properties:
            value:
              type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
              description: Decimal value as string.
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
              description: |
                ISO 4217 currency code of the underlying fiat for pegged
                stablecoins. Use `XXX` for tokens not pegged to a fiat
                currency.
            token_dti:
              type: string
              description: |
                Optional DTI identifying the specific token of compensation.
            instruction_reference:
              type: string
              format: uuid
              description: |
                ID of the compensating pacs.crypto Instruction once created.

    ResponseDataRecord:
      type: object
      description: |
        Structured carrier for investigation response content. Inspired by
        camt.111 `InvestigationDataRecord12Choice` but adapted for the API
        surface: each carrier field is optional rather than constrained by
        an XSD choice. The responder populates the carriers that fit the
        substance of the response. Multi-part responses are submitted as
        separate response submissions across the investigation lifecycle,
        each with its own ResponseDataRecord.

        For simple narrative-only responses, populate only the `narrative`
        field. For substantive responses with structured content (corrected
        party data, charge breakdown, compensating action references), the
        relevant structured carriers should be populated, with `narrative`
        used as supplement where needed.
      properties:
        narrative:
          type: string
          maxLength: 2000
          description: |
            Response narrative as free text. The workhorse field for
            responses that do not need structured carriers. Corresponds to
            the narrative carrier in camt.111.

        corrected_creditor:
          $ref: '#/components/schemas/PartyIdentification'
          description: |
            Corrected or supplemented creditor (beneficiary) party
            identification, used when the investigation concerned missing
            or incorrect creditor data.

        corrected_debtor:
          $ref: '#/components/schemas/PartyIdentification'
          description: |
            Corrected or supplemented debtor (originator) party
            identification.

        charge_details:
          type: object
          description: |
            Structured breakdown of charges. Used in responses to `RQCH`
            (RequestRelatedToCharges) investigations.
          properties:
            gas_units_used:
              type: integer
              description: Total gas units consumed by the transaction (EVM).
            gas_price:
              type: string
              description: |
                Effective gas price in chain-native denomination as a decimal
                string (e.g. "25.5" for 25.5 gwei).
            gas_price_unit:
              type: string
              description: |
                Unit of `gas_price` (e.g. "gwei", "lamports/CU"). Chain-specific.
            total_chain_native_cost:
              type: object
              description: |
                Total chain-native cost (gas, fees) in the chain's native asset.
              properties:
                value:
                  type: string
                  description: Decimal value as string.
                token_dti:
                  type: string
                  description: DTI of the native asset (e.g. ETH, SOL).
            fiat_equivalent_cost:
              type: object
              description: |
                Fiat equivalent of the on-chain cost, for reconciliation
                against treasury accounting systems.
              properties:
                value:
                  type: string
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                  description: |
                    ISO 4217 fiat currency code (USD, EUR, etc.).
                rate_source:
                  type: string
                  maxLength: 70
                  description: Source of the FX rate used.
                rate_timestamp:
                  type: string
                  format: date-time
            service_charges:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    maxLength: 35
                    description: Charge type code or proprietary identifier.
                  value:
                    type: string
                  currency:
                    type: string
                    pattern: '^[A-Z]{3}$'
                  description:
                    type: string
                    maxLength: 280
            explanation:
              type: string
              maxLength: 500
              description: Free-text explanation of the charge structure.

        regulatory_information:
          type: object
          description: |
            Supplemented or clarified regulatory metadata. Used in responses
            to investigations that concern regulatory reporting fields.
          properties:
            authority_country:
              type: string
              pattern: '^[A-Z]{2}$'
            authority_name:
              type: string
              maxLength: 140
            regulation_reference:
              type: string
              maxLength: 70
            details:
              type: string
              maxLength: 1000

        underlying_transaction_reference:
          type: object
          description: |
            On-chain transaction reference when the response concerns a
            specific transaction.
          properties:
            transaction_hash:
              type: string
            block_number:
              type: integer
            chain_dli:
              type: string

        compensating_action:
          type: object
          description: |
            Pointer to a new pacs.crypto operation triggered by the
            investigation (a compensating instruction, return, reversal,
            or amended liquidity transfer).
          properties:
            action_type:
              type: string
              enum: [INSTRUCTION, RETURN, REVERSAL, CANCELLATION, LIQUIDITY_TRANSFER]
            reference_id:
              type: string
              format: uuid
              description: |
                ID of the new operation (instruction_id, return_id, etc.).
            description:
              type: string
              maxLength: 280

        document_reference:
          type: array
          items:
            type: object
            properties:
              document_type:
                type: string
                maxLength: 35
                description: |
                  Document type. Follows `ExternalDocumentType1Code` where a
                  registered code applies, or a proprietary value.
              reference:
                type: string
                maxLength: 70
                description: Document reference number.
              content_hash:
                type: string
                description: |
                  Optional content hash (typically SHA-256) for integrity
                  verification of the out-of-band document.
              available_via:
                type: string
                format: uri
                description: |
                  Optional URI where the requestor can retrieve the document.
                  Subject to bilateral access control.

    InvestigationActionSubmission:
      type: object
      description: |
        Follow-up action on an open investigation. Submitted via
        `POST /investigation/{investigationId}/action`.
      required:
        - message_identification
        - action
      properties:
        message_identification:
          type: string
          maxLength: 35
        action:
          $ref: '#/components/schemas/InvestigationActionCode'
        action_reason:
          $ref: '#/components/schemas/InvestigationActionReasonCode'
        additional_information:
          type: array
          items:
            type: string
            maxLength: 105
          maxItems: 10

    InvestigationDetail:
      type: object
      description: |
        Investigation with its full lifecycle history. Returned by
        `GET /investigation/{investigationId}`.
      properties:
        investigation_id:
          type: string
          format: uuid
        eir:
          type: string
          format: uuid
        original_request:
          $ref: '#/components/schemas/Investigation'
        current_status:
          $ref: '#/components/schemas/InvestigationStatus'
        current_status_reason:
          $ref: '#/components/schemas/InvestigationStatusReason'
        lifecycle:
          type: array
          description: Sequence of state transitions with timestamps.
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              event:
                type: string
                enum: [CREATED, RESPONSE_RECEIVED, ACTION_RECEIVED, STATUS_CHANGED, CLOSED]
              status:
                $ref: '#/components/schemas/InvestigationStatus'
              by_party:
                type: string
                description: LEI of the party that triggered this event.
              detail:
                type: string

    ResponseAcknowledgement:
      type: object
      required: [recorded_at]
      properties:
        recorded_at:
          type: string
          format: date-time
        new_status:
          $ref: '#/components/schemas/InvestigationStatus'

    InvestigationSearchResponse:
      type: object
      description: |
        Paginated search results. Cursor-based pagination: subsequent pages
        are requested by passing the `next_cursor` value as the `cursor`
        query parameter on the next call. Cursors are valid for 24 hours.
      properties:
        page_size:
          type: integer
          description: Number of results in this page.
        next_cursor:
          type: string
          description: |
            Opaque cursor token for the next page. Absent when there are no
            further pages. Pass back as the `cursor` query parameter to
            retrieve the next page.
        total_count_estimate:
          type: integer
          description: |
            Estimated total count across all pages. May be approximate for
            large result sets.
        results:
          type: array
          items:
            $ref: '#/components/schemas/InvestigationSearchResult'

    InvestigationSearchResult:
      type: object
      properties:
        investigation_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/InvestigationType'
        status:
          $ref: '#/components/schemas/InvestigationStatus'
        counterparty_lei:
          type: string
          pattern: '^[A-Z0-9]{20}$'
        created_at:
          type: string
          format: date-time
        last_updated:
          type: string
          format: date-time
        references:
          $ref: '#/components/schemas/InvestigationReferences'

    InvestigationStatusUpdate:
      type: object
      description: |
        Webhook payload pushed to the `webhook_url` of the investigation on
        status transitions. The recipient verifies the delivery using the
        same mTLS plus signed-payload approach used elsewhere in the
        pacs.crypto family (see the Travel Rule API Deployment Ecosystem
        section). The receiving party acknowledges with HTTP 200 within
        the webhook timeout; non-acknowledgement triggers retry with
        exponential backoff.
      required: [investigation_id, event_type, new_status, timestamp]
      properties:
        investigation_id:
          type: string
          format: uuid
        eir:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - RESPONSE_RECEIVED
            - ACTION_RECEIVED
            - STATUS_CHANGED
            - CLOSED
        new_status:
          $ref: '#/components/schemas/InvestigationStatus'
        new_status_reason:
          $ref: '#/components/schemas/InvestigationStatusReason'
        timestamp:
          type: string
          format: date-time
        by_party_lei:
          type: string
          pattern: '^[A-Z0-9]{20}$'
        summary:
          type: string
          maxLength: 280
          description: |
            Brief summary of the event. The full response or action content
            remains retrievable via `GET /investigation/{investigationId}`.

    ErrorResponse:
      type: object
      description: |
        Error response envelope used for all 4xx and 5xx responses across
        the API. The `error_code` field uses the family-level error code
        vocabulary. The following codes are defined for this API:

        - `VALIDATION_FAILED` — request body failed schema validation
        - `UNSUPPORTED_INVESTIGATION_TYPE` — type is not in the supported subset
        - `UNSUPPORTED_REASON_CODE` — reason code is excluded (e.g. AMLI, FCCI, FWTR)
        - `REFERENCE_NOT_FOUND` — referenced instruction, Travel Rule record, or
          reporting entry does not exist or is not accessible to the requestor
        - `INVESTIGATION_NOT_FOUND` — investigation ID does not exist or is not
          accessible to the requesting party
        - `INVESTIGATION_ALREADY_CLOSED` — operation rejected because the
          investigation is in `CLSD` or `RJCT` status
        - `IDEMPOTENCY_DUPLICATE` — request with this idempotency key already
          processed (returned with HTTP 409, response body carries the
          original `investigation_id`)
        - `AUTHENTICATION_FAILED` — mTLS or payload signature verification
          failed
        - `AUTHORISATION_FAILED` — authentication succeeded but the calling
          party is not authorised for this operation
        - `RATE_LIMITED` — too many requests; back off and retry
        - `CURSOR_EXPIRED` — search cursor token is older than 24 hours
        - `INTERNAL_ERROR` — server-side error; safe to retry idempotent
          requests
      required: [error_code, message]
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object

  examples:

