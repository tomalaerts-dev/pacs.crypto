    Example_RQFI_TravelRuleSupplement:
      summary: RequestForInformation — Travel Rule data is missing originator address (bank-on-behalf-of-corporate)
      description: |
        Coinbase Asia is acting on behalf of its corporate customer Acme
        Components Ltd, who has received a USDC transfer and observed that
        the Travel Rule record is missing the originator's postal address.
        EU Transfer of Funds Regulation requires this for cross-border
        transfers above threshold. Coinbase Asia raises the supplement
        request to Bitvavo, with Acme Components Ltd as the request originator.
      value:
        message_identification: "MSG-RQFI-20260615-002"
        requestor_investigation_identification: "CB-INV-2026-00789"
        eir: "660f9511-f3ac-52e5-b827-557766551133"
        investigation_type: "RQFI"
        investigation_reason:
          proprietary: "TRSU"
          additional_information:
            - "Originator postal address missing on Travel Rule record"
            - "Required under EU TFR Article 4(1)(b) for cross-border transfer"
        references:
          travel_rule:
            record_id: "660f9511-f3ac-52e5-b827-557766551133"
        requestor:
          name: "Coinbase Asia Pte Ltd"
          lei: "5493007A8B7BG3DJK1E32"
          country: "SG"
        request_originator:
          name: "Acme Components Ltd"
          lei: "529900XYZ4567ABCD123"
          country: "HK"
        initiating_ai_agent:
          $ref: '#/components/schemas/InitiatingAIAgent'
          description: |
            [EXTENSION — v1.4] Present when an AI agent raised this investigation.
            Discloses which agent, on whose authority, and whether a human was present.
            The agent must hold the RAISE_INVESTIGATION action class in its mandate (see
            the Instruction API MandateEnvelope.authorised_actions); because raising an
            investigation moves information rather than value, the action is
            disclosure-level — identified and scope-checked, but not subject to the
            payment-style amount gates. Omit for human-raised investigations.
        request_originator_relationship: "CUSTOMER"
        responder:
          name: "Bitvavo B.V."
          lei: "7245007VX57GR4IUVZ79"
          country: "NL"
        investigation_service_level: "R01D"
        webhook_url: "https://coinbase-asia.example.com/pacs-crypto/investigation-status"

