openapi: 3.1.0

info:
  title: pacs.crypto — Blockchain Exception and Investigation API
  version: 1.3.0
  description: |
    # Blockchain Exception and Investigation API

    **Fourth specification in the pacs.crypto family.**

    This API supports investigation requests and responses for blockchain-settled
    payments between institutional parties — banks, VASPs, and corporate
    treasuries (whether using a VASP or operating their own infrastructure).
    The data model is grounded in the ISO 20022 camt.110.001.02
    (InvestigationRequest) and camt.111.001.03 (InvestigationResponse) messages
    from the BJ204 Exception and Investigation Modernisation submission. The
    API surface follows modern resource-based conventions: one Investigation
    resource holds the entire conversation, with subordinate resources for
    responses and follow-up actions, rather than mirroring the camt
    request-response message pair one-to-one.

    Institutional parties using this API include financial institutions and
    VASPs (who hold a financial services authorisation and bear institutional
    obligations such as the FATF Recommendation 16 Travel Rule), and corporates
    (who are end-customers of the payment system and subject to general law
    rather than financial services regulation). Corporate use of the API is
    supported throughout; the regulatory obligation is not a precondition for
    using a structured investigation channel. A corporate that finds a
    discrepancy in its blockchain receivables benefits from the structured
    bilateral exchange this API provides, the same way it benefits from
    structured pacs.008 messaging upstream.

    ## Relation to the rest of the pacs.crypto family v1.3

    This API addresses post-settlement investigation flows that the other
    specifications do not cover:

    - The **Travel Rule API** handles initial identity exchange. Rejection
      with reason flows through its callback mechanism. Travel Rule
      *supplementation* requests after settlement land here.
    - The **Instruction API** handles instruction submission, status retrieval,
      cancellation, and returns/reversals through compensating transactions.
      Status queries against an open instruction use that API's GET endpoint.
      Cross-institutional clarification queries about settled instructions
      land here.
    - The **Account Reporting API** handles routine balance and transaction
      reporting. Queries about specific historic transactions that need a
      bilateral conversation land here.
    - The **Liquidity Management API** covers own-account liquidity moves.
      Investigations on a liquidity transfer follow the same shape as
      investigations on a customer-instructed payment, with the wallet
      transfer ID provided in the instruction_reference.

    ## Party chain — who acts on whose behalf

    Investigation flows in payment systems are rarely just one institution
    asking another. A typical case is: a corporate customer raises a question
    with its bank; the bank formalises the question as an investigation
    against the counterparty bank or VASP; the counterparty receives it,
    consults its own customer or internal team for the substantive answer,
    repackages and responds to the requesting bank; the bank relays to its
    customer.

    Following the camt.110/111 model, the Investigation carries the party
    chain explicitly. Three party fields are defined on the Investigation
    request side:

    - `requestor` — the institutional party that holds the bilateral
      relationship and submits the investigation via the API.
    - `request_originator` (optional) — the party on whose behalf the
      investigation is being raised, where the requestor is acting for a
      customer or other underlying party. Populated when the requestor is
      a bank or VASP raising the investigation for an underlying corporate
      customer, or when the requestor is a treasury department raising on
      behalf of a business unit. Omitted when the requestor is also the
      underlying interested party (for example a self-hosting corporate
      raising directly).
    - `expected_responder` — the institutional party the requestor expects
      to answer.

    On the response side:

    - `responder` — the institutional party that submits the response via
      the API. Set in the InvestigationResponseSubmission.
    - `response_originator` (optional) — the party that produced the
      substantive answer. May be the responder's customer, an internal team,
      or another party reached by the responder. Useful for downstream
      audit and reconciliation. Omitted when the responder produces the
      answer itself.

    Anti-tipping-off discipline applies to the originator fields. The
    `request_originator` field is populated when the underlying customer
    identity is operationally needed to answer the investigation. Where the
    question can be answered without identifying the customer behind the
    requestor, the field is omitted. The discipline is bilateral and
    contextual; the spec recommends rather than enforces.

    ## Scope — what this API does and does not cover

    The API supports the subset of camt.110/111 business scenarios that
    apply meaningfully to on-chain settlement. Investigation types not in
    scope are documented explicitly so implementers understand why.

    **Supported investigation types:**

    - `UTAP` UnableToApplyByCreditor — the receiving party received an
      on-chain credit but cannot match it to a customer or instruction.
      A typical case: a VASP receives a transfer to a wallet under its
      control but the originator's reference does not map to any expected
      payment, or the creditor identity does not match any KYC record
      attached to the destination wallet.
    - `RQFI` RequestForInformation — generic request for clarification or
      additional data. Used for Travel Rule supplementation, attestation
      verification, narrative explanation, and bilateral clarification of
      data already exchanged. The investigation reason code carries the
      specifics of what is requested.
    - `RQCH` RequestRelatedToCharges — questions about gas fees, VASP
      service charges, slippage costs, or bridge-leg fees. On-chain gas is
      publicly observable but the allocation of fees between the sender,
      receiver, and any intermediaries may need clarification.
    - `ACCT` AccountRelatedInvestigation — wallet-related questions: status
      of a wallet, ownership confirmation post-settlement, account-closure
      reporting questions, and similar.
    - `OTHR` Other — catch-all for scenarios that do not fit the above.
      Free text in the narrative.

    **Investigation types deliberately excluded with rationale:**

    - `CCNR` ClaimNonReceipt — does not apply on-chain. On-chain settlement
      is publicly observable: anyone with the transaction hash can verify
      whether a transfer settled at the destination wallet. There is no
      ambiguity about whether the credit happened that would require a
      bilateral investigation.
    - `CONR` CreditorAgentClaimCoverNonReceipt — same reason. The
      "cover payment" concept of conventional correspondent banking does
      not have a direct on-chain analogue; on-chain transfers settle
      atomically.
    - `RQVA` RequestValueDateAdjustment — does not apply on-chain. The
      settlement timestamp is the block timestamp, set by the chain at
      inclusion time and not retroactively adjustable.
    - `RQDA` RequestDebitAuthorisation — does not apply on-chain. On-chain
      transfers require the wallet holder's signature; no party can debit
      another's wallet by authorisation. The compensating transaction
      model in the Instruction API (POST /instruction/{id}/return and
      /reverse) handles what conventional payments would handle through
      debit authorisation, and it works because it is a cooperative new
      transfer rather than a unilateral debit.
    - `RQUF` RequestUseOfFunds — partially covered by Account Reporting
      status fields and by the Instruction API status response, both of
      which carry sufficient detail for routine queries. Where a richer
      bilateral conversation about the use of funds is needed, the case
      is folded into `RQFI` RequestForInformation with appropriate reason.
    - `PINC` PaymentInitiationNotConfirmed — covered by the Instruction
      API's `GET /instruction/{instructionId}` endpoint. The on-chain
      transaction status is publicly verifiable through the transaction
      hash; a bilateral payment-initiation-not-confirmed flow is not needed.
    - `RIMF` RequestFromIMF — out of scope for the institutional crypto
      payments market at this stage. May be considered in a future revision.

    ## Investigation reason codes — discipline on compliance-related vocabulary

    The pacs.crypto Exception and Investigation API deliberately restricts the
    investigation reason code subset to **omit** the codes that name a
    regulatory compliance reason directly. Specifically, the following ISO 20022
    `ExternalInvestigationReason1Code` values are **not** supported as
    investigation reasons in this API:

    - `AMLI` AntiMoneyLaundering
    - `FCCI` FinancialCrimeCompliance
    - `FWTR` FundsTransferRegulation

    The reasoning is the same discipline applied across the pacs.crypto family
    in the Instruction API rejection vocabulary: where a structured code could
    be populated by one regulated party against another and would communicate
    that a regulatory action is in progress against the counterparty's
    customer, the code becomes a tipping-off vocabulary. Anti-tipping-off
    obligations under EU AMLD Article 39, UK POCA 2002, and US Bank Secrecy
    Act prohibit a payment system from communicating to the customer (or to
    parties who could relay to the customer) that a transaction was held or
    investigated for sanctions, AML or financial crime reasons.

    The conventional camt.110 context where these codes can sometimes be
    used legitimately (inter-correspondent-bank dialogue at an operational
    level) is narrower than the typical pacs.crypto context (bilateral
    VASP-to-VASP, VASP-to-bank, or corporate-direct interactions where the
    information is more likely to reach the customer). Omitting these codes
    keeps the discipline consistent with the rest of the family.

    Where a compliance-related question genuinely needs to be raised, the
    `RQFI` RequestForInformation type with the `RQDO` RequestDocumentation
    reason code or the `NARR` Narrative reason code is the recommended path.
    The narrative is bilateral and is not part of the API's structured
    vocabulary, which gives the requesting party flexibility while keeping
    the structured codes themselves clean.

    ## Crypto-specific investigation reason codes proposed for ISO 20022

    Three new reason codes are proposed as extensions to the
    `ExternalInvestigationReason1Code` external code set for crypto contexts:

    - `TRSU` TravelRuleSupplement — Travel Rule data is incomplete and
      supplementation is requested by the receiving party. Typical case: the
      initial Travel Rule record arrived without the originator's postal
      address, beneficiary VASP identification, or required regulatory metadata.
    - `WALV` WalletVerification — confirmation that a wallet address is
      controlled by the named party. Used pre-settlement (as a sanity check
      before broadcast) or post-settlement (to resolve UTAP cases where the
      receiver cannot map the wallet to a customer).
    - `ATTR` AttestationRequest — request for credential attestation
      reference or content. Used where an investigation needs to verify
      ERC-3643, EAS, or other on-chain compliance attestations referenced
      in the original transaction.

    Until these codes are formally registered, implementations may carry
    them as proprietary codes under the `proprietary` field with issuer
    `pacs.crypto`. Once registered, they migrate to the `code` field.

    Other crypto-specific questions (chain archive references, finality
    clarification, block-level audit) are handled with existing codes:
    `RQDO` RequestDocumentation with a narrative carries them adequately
    without inventing additional codes.

    ## Status flow

    The investigation lifecycle follows the camt.110/111 status model:

    - `PDNG` Pending — investigation is open and a response is expected.
    - `CLSD` Closed — investigation is closed, either by a substantive
      response or by withdrawal from either side.
    - `RJCT` Rejected — investigation cannot be progressed (incorrect
      counterparty, duplicate, regulatory blocker).

    Detailed status reasons follow the `ExternalInvestigationStatusReason1Code`
    set: `INPO` InProgress, `ARPL` AwaitingReplyFromCustomer, `NOAS` NoAnswer,
    `CAPR` ClosedAsPerRequest, `RR04` RegulatoryReason (used by the responder,
    not the requestor — the asymmetry of tipping-off concern), and others.

    ## Response data structure — InvestigationDataRecord12Choice-inspired

    Response content is modelled on the camt.111 `InvestigationDataRecord12Choice`
    structure but adapted for the API surface. Where camt.111 uses an XSD choice
    to enforce that exactly one structured carrier is populated per response,
    the API offers the same set of carriers as an open set: each field is
    optional, and a responder populates the carriers that fit the content of
    the response. The structural advantage of carrying corrected party data,
    charge clarification, supplementing regulatory information, and references
    to compensating actions in structured form is preserved without the
    constraints of the XSD choice.

    The response data record carries:

    - `narrative` — the response narrative as free text, the workhorse field
      for responses that do not need structured carriers (corresponds to the
      narrative carrier in camt.111).
    - `corrected_creditor` and `corrected_debtor` — supplemented or corrected
      party information, where the investigation concerned missing or
      incorrect identity data.
    - `charge_details` — structured gas-fee and charge breakdown, used in
      responses to `RQCH` investigations.
    - `regulatory_information` — supplemented or clarified regulatory metadata.
    - `underlying_transaction_reference` — on-chain transaction hash and
      block reference when the response concerns a specific transaction.
    - `compensating_action` — pointer to a new pacs.crypto Instruction,
      return, or reversal triggered by the investigation.
    - `document_reference` — reference to an out-of-band attached document,
      with type, reference, content hash, and access URI.

    A single response submission carries one ResponseDataRecord. Multi-part
    responses are handled by submitting multiple responses across the
    investigation lifecycle, each with its own substantive ResponseDataRecord.

    ## Linkage to instructions, Travel Rule records, and reporting entries

    An investigation references the underlying business event that triggered
    it through one of three reference fields:

    - `instruction_reference` — pointer to a pacs.crypto Instruction API
      record (instruction ID and UETR). Also used for liquidity transfer
      records from the Liquidity Management API, where the transfer ID is
      carried in `instruction_id`.
    - `travel_rule_reference` — pointer to a pacs.crypto Travel Rule API
      record (record ID).
    - `reporting_reference` — pointer to a transaction entry in an Account
      Reporting API report (transaction hash and report ID).

    At least one of these references must be present. Multiple references
    are permitted when the investigation spans more than one underlying
    record.

    ## Multi-party scenarios — bilateral by design

    Each investigation is bilateral: one requestor, one responder. Cases where
    information is needed from a third party (for example, a bridged transfer
    where both source-chain VASP and destination-chain VASP have relevant
    information) are handled with separate linked investigations rather than
    a single multi-party investigation. The `eir` End-to-end Investigation
    Reference can be reused across linked investigations to support audit
    correlation, but each bilateral exchange is its own resource.

    This is the same shape camt.110 uses, and it keeps the response and
    action workflow tractable. Implementers building multi-party workflows
    in their own systems are free to do so, with the API surface exposing
    each bilateral leg.

    ## Methods on the Investigation resource

    The API surface uses modern resource-based conventions:

    - `POST /investigation` — create a new investigation.
    - `GET /investigation/{investigationId}` — retrieve the current state
      of an investigation including its lifecycle history.
    - `POST /investigation/{investigationId}/response` — submit a response
      to an open investigation. Multiple responses may be submitted across
      the lifecycle (initial response, follow-up, closure).
    - `POST /investigation/{investigationId}/action` — submit a follow-up
      action such as `RQCL` RequestInvestigationClosure, `RQST`
      RequestInvestigationStatus, `RQOB` RequestObjection.
    - `GET /investigation/search` — search this party's investigation records
      with filters for status, type, time window, counterparty. Results are
      paginated with cursor-based pagination (`next_cursor` in the response,
      `cursor` query parameter on subsequent calls).

    Status push notifications follow the pacs.crypto family pattern: bilateral
    webhook callbacks for status changes are supported through the
    `webhook_url` field on the investigation; the recipient pushes
    `InvestigationStatusUpdate` notifications on transitions. `GET` remains
    available as a polling fallback. The webhook payload schema is defined
    in `InvestigationStatusUpdate` under components/schemas.

    ## Closure actions — what happens when the requestor sends RQCL

    A `RQCL` RequestInvestigationClosure action submitted by the requestor
    is a request, not a unilateral close. The responder evaluates and
    either acknowledges (closing the investigation) or continues with a
    response if substantive work has already been done. The responder
    should acknowledge or continue within the investigation service-level
    window. Where the responder does not acknowledge a closure request and
    does not respond substantively, the requestor may submit a follow-up
    `RQST` RequestStatus action to elicit a response. The current API does
    not auto-close investigations on responder non-acknowledgement; this
    remains a bilateral matter to be handled outside the API.

    ## Authentication, transport, and counterparty discovery

    The API is designed to operate within the deployment ecosystem
    established by the pacs.crypto Travel Rule API. Specifically:

    - Authentication uses mTLS plus signed payloads, as documented in the
      Travel Rule API's Deployment Ecosystem section.
    - Counterparty discovery — how the requestor obtains the responder's
      endpoint URL — follows the same approach as the Travel Rule API,
      with bilateral configuration as the v1.3 default and a directory
      service as a candidate for later evolution.
    - Webhook delivery uses the same authentication pattern as the
      caller-to-callee direction: mTLS plus signed payloads, with the
      responder's signing key verified against the responder's
      institution-level certificate.

    These remain implementation choices made bilaterally between
    institutional parties; the API specification does not mandate a single
    PKI model or directory service.

    ## Idempotency and uniqueness

    `POST /investigation` is idempotent on `requestor_investigation_identification`.
    The identifier must be unique within the requestor's investigation records
    for at least the lifetime of the investigation plus the retention window
    of the requestor (typically seven years for institutional records).
    Reusing an identifier within that window will return the original record
    on retry rather than creating a new investigation.

    ## Pagination, lifecycle size, and operational caps

    The search endpoint uses cursor-based pagination. Default page size is 50,
    maximum 200. Cursor tokens are valid for 24 hours.

    The investigation lifecycle (array of state transitions returned in
    `GET /investigation/{investigationId}`) is returned in full by default.
    For investigations with extensive history, the `?lifecycle_limit` query
    parameter caps the number of lifecycle entries returned, with the most
    recent entries returned first. The Investigation itself remains complete
    regardless of lifecycle pagination.

    ## Time zones

    All date-time fields in the API are expressed in UTC, using ISO 8601
    format with the trailing `Z` notation. Implementations should not use
    local time-zone offsets in any date-time field of the API.

    ## Versioning policy

    The API uses semantic versioning aligned with the pacs.crypto family
    version. The current version is v1.3.0. Minor version increments (v1.4,
    v1.5) are backwards-compatible: new optional fields may be added; new
    enum values may be added (consumers should treat unknown enum values
    gracefully); no field is removed or made required from previously
    optional. Major version increments (v2.0) may introduce breaking
    changes with at least a 12-month deprecation window for the prior
    major version. The current minor version is communicated in the
    response payload's `_meta.api_version` field where applicable.

    ## Error codes

    Errors returned with HTTP 4xx and 5xx responses use the family-level
    error code vocabulary. Codes are documented under
    `components/schemas/ErrorResponse` and follow the same shape as the
    rest of the pacs.crypto family.

    ## Sanctions discipline carried through from the rest of the family

    The same anti-tipping-off discipline that applies to the Instruction API's
    reversal rejection vocabulary applies here. Investigation status reasons
    that could indicate a regulatory hold are intentionally aggregated under
    `OTHR` Other rather than communicated through a structured code. Where a
    responding party cannot disclose the reason for declining to progress an
    investigation, the response status is `RJCT` Rejected with reason code
    `LEGL` LegalDecision or `RR04` RegulatoryReason — both of which are
    already in the ISO 20022 status reason code set and are used by the
    *responder* declining to disclose rather than by the *requestor*
    accusing the counterparty. This asymmetry is operationally and legally
    significant.

