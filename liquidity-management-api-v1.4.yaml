openapi: 3.1.0

info:
  title: pacs.crypto — Blockchain Liquidity Management API
  version: 1.3.0
  description: |
    # Blockchain Liquidity Management API

    **Fifth specification in the pacs.crypto family.**

    This API supports own-account liquidity operations: moving funds between
    wallets controlled by the same legal account holder, querying wallet
    positions, and managing operational limits on wallets. The data model
    is grounded in the ISO 20022 camt family — camt.050 LiquidityCreditTransfer
    for own-account transfers, camt.004 ReturnAccount and camt.052
    BankToCustomerAccountReport for position reporting, and the camt.009-012
    limit message family for limit query and amendment.

    ## Scope — own-account liquidity, not customer payments

    The defining characteristic of this API is that the **legal account
    holder is the same on both sides of the transfer**. The originator and
    beneficiary parties are the same entity operating different wallets,
    possibly on different chains, for operational, risk, or regulatory reasons.

    This scope distinction has two material consequences:

    1. **FATF Travel Rule does not fire for internal moves.** FATF
       Recommendation 16 applies to transfers between different originator
       and beneficiary persons. When the legal holder is the same, the
       inter-party identity exchange that the Travel Rule API performs is
       not needed. The pacs.crypto Travel Rule API is not used by Liquidity
       Management operations. This is operationally significant because it
       lets liquidity moves happen without the bilateral identity exchange
       overhead. Implementations must still satisfy their own internal
       controls and reporting obligations, and the inter-institutional
       Travel Rule transmission is the part that is bypassed.

    2. **The instruction surface is simpler.** Counterparty party
       identification, remittance information, purpose code (the purpose
       is by definition treasury operations), and charge bearer choice
       (the same legal entity bears all costs) are all absent. The
       instruction carries the operationally necessary fields: source
       wallet, destination wallet, amount, token, chain, and operational
       guidance.

    Customer-instructed payments — even where the customer happens to be
    the institution executing the transfer — are out of scope. Those use
    the Instruction API with appropriate party identification.

    ## Resources in scope of v1.3.0

    Four resources are defined at v1.3.0:

    - **WalletTransfer** — execute a transfer of value from one wallet to
      another wallet under the same legal holder, same chain or cross-chain.
    - **WalletPosition** — query the current balance, available balance,
      and pending in-flight transfers on one or more wallets.
    - **WalletLimit** — query the operational, regulatory, or risk-based
      limits applied to a wallet, and request amendment of those limits.

    The fourth resource is implicit in the WalletTransfer endpoint family:
    a status retrieval and search surface for historic transfers, following
    the same pattern as the Instruction API.

    ## Cross-chain transfers — bridge mechanism is a VASP responsibility

    Cross-chain liquidity moves require a bridge protocol (an on-chain
    mechanism that locks value on the source chain and mints or releases
    it on the destination chain). Bridge protocols evolve fast, and the
    instructing party typically has less information about current bridge
    liquidity, gas pricing, and routing efficiency than the executing VASP.

    The API surface follows this operational reality: the instructing party
    specifies only the source and destination wallets, the token, the
    chains, and the amount. **The VASP chooses the bridge protocol and
    executes the routing.** The instructing party may optionally express a
    preference (`OPTIMISE_COST`, `OPTIMISE_TIME`, `OPTIMISE_FINALITY`) and
    a maximum slippage rate that bounds exposure on the bridge leg.

    The VASP reports the bridge protocol used, the destination transaction
    hash, the bridge-leg cost, and the elapsed time in the transfer's
    status response. This keeps the cross-chain operation simple from the
    instructing party's perspective while giving the VASP operational
    latitude. It also avoids locking the spec into any particular bridge
    technology.

    ## Future scope deferred to a later version

    The following operations are anticipated for v2.0 of this API. They
    are not included in v1.3.0 because they benefit from operational
    experience with the basic transfer and reporting primitives first:

    - **Pooling** — automated rebalancing across a set of wallets to
      maintain target balances.
    - **Sweeping** — automated movement of excess balance from operational
      wallets to a designated treasury wallet.
    - **Netting** — between-wallet netting across multiple participants
      (where the participants agree to a multilateral net settlement).
    - **Standing orders** — periodic rebalancing on a schedule.
    - **Cash concentration across multiple legal entities** — group
      treasury operations where the legal account holder differs between
      wallets but the group treasury function spans them.

    The v1.3.0 spec defines the data model in a way that v2.0 can extend
    rather than replace. Wallet position queries are designed to be
    aggregatable across wallets; transfer instructions are designed to be
    referenceable by future standing-order definitions; limit queries are
    designed to be extendable to pool-level and group-level limits.

    ## Relation to the rest of the pacs.crypto family v1.3

    - **Instruction API.** Customer-instructed payments where the originator
      and beneficiary are different legal entities. Liquidity Management
      and Instruction API share the on-chain identifier conventions (DTI,
      DLI, EWAL wallet account proxy) but have separate operational surfaces.
    - **Travel Rule API.** Not used by Liquidity Management operations (see
      scope note above).
    - **Account Reporting API.** Wallet positions and historic transactions
      are accessible through both APIs but with different operational
      framings: Account Reporting is for reconciliation and audit reporting,
      Liquidity Management is for in-flight position queries that inform
      transfer decisions. A liquidity transfer executed through this API
      generates an Account Reporting entry on both wallets (debit on source,
      credit on destination, marked with the same `transfer_reference` for
      cross-API correlation). Account Reporting consumers can recognise
      these as own-account moves via the `transfer_reference` correlation
      and the matching debit/credit pair under the same account holder.
    - **Exception and Investigation API.** Investigations on liquidity
      transfers follow the same pattern as on customer instructions, with
      the LiquidityTransfer ID provided in the `instruction_reference.instruction_id`
      field of the Investigation.

    ## Cross-chain settlement timing

    Cross-chain transfers using a bridge protocol settle on a timescale
    determined by the bridge mechanism, which the VASP selects per transfer.
    Typical ranges:

    - **Fast canonical bridges** (e.g. Circle CCTP for USDC): minutes
    - **Liquidity-network bridges** (e.g. Across, Stargate): minutes to tens of minutes
    - **Optimistic-rollup-aware bridges** (e.g. native L2 withdrawal bridges):
      hours to seven days depending on the chain pair

    The `estimated_completion` field on the transfer response carries the
    VASP's best estimate at submission time. Implementations should not
    rely on cross-chain transfers settling within a fixed window. The
    `expiry_date_time` field on the request bounds the latest acceptable
    execution time.

    ## Bridge failure and recovery

    Bridge protocols can fail mid-flight: value can be locked on the source
    chain but the destination-chain minting or release can fail or take
    much longer than expected. The transfer status `BRIDGE_STUCK` is used
    when the VASP detects this condition. A `BRIDGE_STUCK` transfer is
    not necessarily lost; recovery may be possible through:

    - Manual bridge intervention by the VASP, where the bridge protocol
      supports it.
    - Use of the bridge protocol's own recovery mechanism (where one exists,
      such as Circle CCTP's attestation-based recovery).
    - Refund to the source wallet if the destination side is permanently
      unable to complete.

    The transfer's status detail will indicate which recovery path applies.
    Financial responsibility for stuck funds is a bilateral matter between
    the instructing party and the VASP, defined in their service agreement,
    rather than specified by this API.

    ## Token representation across chains

    A token of the same logical brand may exist in multiple representations
    on a destination chain. USDC, for example, has both native USDC
    (issued by Circle directly) and bridged USDC.e (from earlier bridge
    eras) on chains such as Avalanche. The DTI in the request identifies
    the source-chain token. The VASP determines the appropriate
    destination-chain token representation based on:

    - The destination chain's native or canonical issuance of the same brand
      (preferred where available).
    - The bridge protocol's native token semantics (some bridges only
      support specific token representations).
    - The instructing party's `bridge_preference` (specifically
      `OPTIMISE_FINALITY` may prefer canonical issuance even at higher cost).

    The transfer response and status reporting carry the actual
    destination-chain token DTI in the `destination_token` field. The
    instructing party should validate the destination token matches its
    operational expectation before treating the transfer as complete.

    ## Wallet position calculation

    Position queries return three balance values per token:

    - `current_balance` — booked balance reflecting confirmed on-chain state
      at the VASP's last reconciliation point.
    - `pending_inbound` — sum of accepted inbound transfers not yet finalised
      on-chain.
    - `pending_outbound` — sum of accepted outbound transfers not yet
      broadcast or not yet finalised on-chain.
    - `available_balance` — current_balance minus pending_outbound minus any
      operational holds applied by the VASP.

    The exact rules for what constitutes an "operational hold" — tokens
    locked in smart contracts (staked, lent to DeFi), tokens earmarked for
    queued transfers, tokens under operational review — are
    implementation-dependent and vary by VASP. Implementations should
    document their hold logic bilaterally with customers. The position
    response carries a `holds_detail` array enumerating any non-zero holds
    contributing to the difference between `current_balance` and
    `available_balance`.

    ## Multiple limits on the same wallet

    A wallet may have several limits with different periods and bases
    simultaneously. For example: a $1M daily limit (OPERATIONAL), a $5M
    weekly limit (RISK), and a $20M monthly limit (REGULATORY). All
    applicable limits are evaluated on each transfer; the most restrictive
    available headroom determines whether a transfer is permitted. Each
    limit tracks its own `consumed` and `available` separately, with its
    own period boundary.

    The limit amendment workflow varies by basis:

    - `OPERATIONAL` limits are typically self-service amendable by the
      account holder through the API, with effect immediate.
    - `RISK` limits typically require the VASP's risk committee approval;
      the API records the request and returns `PENDING_APPROVAL` status.
    - `REGULATORY` limits cannot be amended through the API and return
      HTTP 422 on attempt. Changes to regulatory limits are handled
      through the relevant regulator's process.

    The exact approval workflow is implementation-dependent; the API
    surface accepts the request and returns the resulting status.

    ## Authentication, transport, and counterparty discovery

    The API is designed to operate within the deployment ecosystem
    established by the pacs.crypto Travel Rule API. Authentication uses
    mTLS plus signed payloads. Counterparty discovery — how the instructing
    party obtains the VASP's endpoint URL — follows the same approach as
    the rest of the family, with bilateral configuration as the v1.3
    default and a directory service as a candidate for later evolution.
    These remain implementation choices made bilaterally between
    institutional parties; the API specification does not mandate a single
    PKI model or directory service.

    ## Amount and currency convention

    Amounts in this API follow the family convention. The `value` is a
    decimal string preserving full precision. The `currency` is the
    ISO 4217 code of the underlying fiat for pegged stablecoins (USD for
    USDC, EUR for EURC, and so on), or `XXX` (ISO 4217 "no currency
    involved") for tokens that are not pegged to a fiat currency such as
    ETH, BTC, or governance tokens. The DTI in `token.token_dti`
    identifies the specific asset.

    This convention is consistent across the Instruction API,
    Account Reporting API, Exception & Investigation API, and the
    Travel Rule API.

    ## Time zones

    All date-time fields in the API are expressed in UTC, using ISO 8601
    format with the trailing `Z` notation. Implementations should not use
    local time-zone offsets in any date-time field of the API.

    ## Versioning policy

    The API uses semantic versioning aligned with the pacs.crypto family
    version. The current version is v1.3.0. Minor version increments are
    backwards-compatible: new optional fields may be added; new enum values
    may be added (consumers should treat unknown enum values gracefully);
    no field is removed or made required from previously optional. Major
    version increments may introduce breaking changes with at least a
    12-month deprecation window for the prior major version.

    Future scope deferred to v2.0 (pooling, sweeping, netting, standing
    orders, cash concentration) will be added as new optional resources
    and operations under the same v1.x family wherever possible, with v2.0
    reserved for changes that genuinely require breaking the v1.3 data
    model.

    ## Error codes

    Errors returned with HTTP 4xx and 5xx responses use the family-level
    error code vocabulary. Codes specific to this API include:

    - `VALIDATION_FAILED` — request body failed schema validation
    - `WALLET_NOT_FOUND` — source or destination wallet not recognised by
      the VASP for the account holder
    - `INSUFFICIENT_BALANCE` — source wallet does not have enough available
      balance for the transfer
    - `LIMIT_EXCEEDED` — transfer would exceed an applicable limit; the
      response details identifies which limit
    - `SLIPPAGE_EXCEEDED` — actual bridge-leg slippage would exceed
      `maximum_slippage_rate`
    - `BRIDGE_UNAVAILABLE` — no suitable bridge protocol available for this
      chain pair and token at this time
    - `BRIDGE_STUCK` — transfer is stuck mid-bridge; recovery may be
      possible (see Bridge failure and recovery)
    - `EXPIRED` — transfer expired before execution per `expiry_date_time`
    - `REGULATORY_LIMIT_NOT_AMENDABLE` — attempt to amend a REGULATORY-basis
      limit through the API
    - `IDEMPOTENCY_DUPLICATE` — transfer with this `transfer_reference`
      already exists
    - `AUTHENTICATION_FAILED`, `AUTHORISATION_FAILED`, `RATE_LIMITED`,
      `INTERNAL_ERROR` — as documented in the family-level vocabulary

