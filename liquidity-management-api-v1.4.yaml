servers:
  - url: https://api.example-vasp.com/v1
    description: VASP-hosted Liquidity Management API endpoint
  - url: https://example-bank.com/api/pacs-crypto/v1
    description: Bank-hosted Liquidity Management API endpoint

tags:
  - name: Transfer
    description: Wallet-to-wallet transfer operations.
  - name: Position
    description: Wallet balance and activity queries.
  - name: Limit
    description: Wallet operational, regulatory, and risk limits.

paths:

  /wallet-transfer:
    post:
      tags: [Transfer]
      operationId: submitWalletTransfer
      summary: Submit an own-account wallet-to-wallet transfer
      description: |
        Submits a transfer of value from a source wallet to a destination
        wallet, both under the same legal account holder. May be same-chain
        or cross-chain. Cross-chain transfers use a bridge protocol chosen
        by the executing VASP.

        **Idempotency:** `POST /wallet-transfer` is idempotent on
        `transfer_reference`. Safe to retry after timeout.

        **Travel Rule applicability:** Travel Rule data exchange is not
        required for own-account transfers because the legal account holder
        is the same on both sides. The transfer is internal from a
        regulatory perspective.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletTransfer'
            examples:
              same_chain_usdc:
                $ref: '#/components/examples/Example_SameChain_USDC'
              cross_chain_usdc_bridge:
                $ref: '#/components/examples/Example_CrossChain_USDC'
      responses:
        '201':
          description: Transfer accepted for execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: |
            Idempotent duplicate — a transfer with the same `transfer_reference`
            already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wallet-transfer/{transferId}:
    get:
      tags: [Transfer]
      operationId: getWalletTransfer
      summary: Retrieve wallet transfer status and on-chain settlement evidence
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransferDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /wallet-transfer/search:
    get:
      tags: [Transfer]
      operationId: searchWalletTransfers
      summary: Search this party's historic wallet transfers
      description: |
        Returns wallet transfers this party has originated, filtered by
        status, wallet, token, and time window. Results are paginated with
        cursor-based pagination; the response carries `next_cursor` if
        more results are available. Cursors are valid for 24 hours.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, BROADCAST, FINAL, BRIDGE_STUCK, FAILED]
        - name: source_wallet
          in: query
          schema:
            type: string
        - name: destination_wallet
          in: query
          schema:
            type: string
        - name: token_dti
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
          description: |
            Pagination cursor from a previous page's `next_cursor`. Omit
            for the first page.
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransferSearchResponse'

  /wallet-position:
    get:
      tags: [Position]
      operationId: getWalletPosition
      summary: Retrieve current wallet position(s)
      description: |
        Returns the current balance, available balance, and pending in-flight
        transfers on the specified wallets. May be queried for a single
        wallet or for a set of wallets in one call.

        The pending in-flight amount reflects transfers that have been
        accepted but are not yet finalised on-chain. This gives the
        instructing party a true picture of usable liquidity for further
        operations.

        For wallets holding many tokens (a common case on EVM chains where
        dust accumulates), use the `min_balance_value_usd` parameter to
        filter out tokens below a chosen value threshold. The threshold is
        evaluated against the VASP's current fiat-equivalent valuation.
      parameters:
        - name: wallets
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          description: |
            One or more wallet addresses to query. Comma-separated.
        - name: chain_dli
          in: query
          schema:
            type: string
          description: |
            Optional filter by chain. If omitted, positions across all chains
            on which the wallets are observed are returned.
        - name: token_dti
          in: query
          schema:
            type: string
          description: |
            Optional filter by token. If omitted, all tokens held in the
            wallets are returned.
        - name: include_pending
          in: query
          schema:
            type: boolean
            default: true
          description: Include in-flight transfers in the position calculation.
        - name: min_balance_value_usd
          in: query
          schema:
            type: string
            pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            Optional minimum value threshold in USD-equivalent. Tokens with
            current_balance below this threshold are excluded from the
            response. Useful for filtering dust on wallets that have
            accumulated many low-value token holdings.
        - name: include_zero_balances
          in: query
          schema:
            type: boolean
            default: false
          description: |
            Include tokens with zero current balance in the response.
            Default false (only non-zero balances returned).
      responses:
        '200':
          description: Position(s) retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPositionResponse'

  /wallet-limit:
    get:
      tags: [Limit]
      operationId: getWalletLimit
      summary: Retrieve current limit(s) applied to a wallet
      description: |
        Returns the operational, regulatory, and risk-based limits applied
        to the specified wallet. Limits are categorised by type (daily,
        weekly, per-transaction, cumulative) and by basis (operational,
        regulatory, risk).
      parameters:
        - name: wallet
          in: query
          required: true
          schema:
            type: string
        - name: chain_dli
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Limits retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletLimitResponse'

    post:
      tags: [Limit]
      operationId: amendWalletLimit
      summary: Request amendment of a wallet limit
      description: |
        Submits a request to amend a limit on a wallet. The actual change
        may require bilateral confirmation, regulatory approval, or risk
        committee sign-off depending on the limit basis. The response
        indicates whether the amendment is immediate, pending, or rejected.

        Regulatory limits (`REGULATORY` basis) cannot be amended through
        this API and return 422 if attempted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletLimitAmendment'
      responses:
        '201':
          description: Amendment request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletLimitAmendmentResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Request well-formed but logically invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    InitiatingAIAgent:
      type: object
      description: |
        [EXTENSION — v1.4] The AI agent that initiated this liquidity action, for
        compliance disclosure. The authoritative identity attestation and mandate
        verification — including the action-class check (MANAGE_LIQUIDITY for a
        transfer, AMEND_LIMIT for a limit change) and that action class's constraints
        (e.g. max_transfer_amount, max_limit_ceiling) — happen via the agentic binding
        defined in the Instruction API (MandateEnvelope.authorised_actions). This block
        carries the compliance-visible subset so the fact travels and is reportable.
        An agent moving liquidity or changing limits is value-like, so unlike raising
        an investigation it IS subject to real constraints in its mandate's action scope.
      required:
        - ai_agent_identifier
        - principal
      properties:
        ai_agent_identifier:
          type: string
          maxLength: 512
          description: The agent's distinct identifier (DID or vLEI delegated id).
        ai_agent_operator:
          type: string
          maxLength: 350
          description: Optional. The party operating the agent, where it differs from the principal.
        principal:
          type: object
          description: The entity or person on whose behalf the agent acts (LEI or other scheme).
          oneOf:
            - type: object
              required: [lei]
              properties:
                lei:
                  type: string
                  pattern: '^[A-Z0-9]{18}[0-9]{2}$'
            - type: object
              required: [other_identity]
              properties:
                other_identity:
                  type: object
                  required: [scheme, identifier]
                  properties:
                    scheme:
                      type: string
                      maxLength: 50
                    identifier:
                      type: string
                      maxLength: 512
        mandate_reference:
          type: string
          maxLength: 2048
          description: The mandate under which the agent acted (must include the relevant liquidity action scope).
        human_present:
          type: boolean
          description: Whether a human approved this specific action (true) or it was fully autonomous (false).

    # ── ENUMERATIONS ──────────────────────────────────────────────────────────

    TransferStatus:
      type: string
      description: |
        Transfer lifecycle status.

        - `PENDING` — accepted by VASP, not yet broadcast.
        - `BROADCAST` — broadcast to source chain, awaiting confirmation.
        - `FINAL` — settled with finality (same-chain) or with destination-side
          confirmation (cross-chain).
        - `BRIDGE_STUCK` — cross-chain transfer where source-side has settled
          but destination-side is failing or significantly delayed. Recovery
          may be possible; see the Bridge failure and recovery section.
        - `FAILED` — transfer failed and will not settle.
      enum:
        - PENDING
        - BROADCAST
        - FINAL
        - BRIDGE_STUCK
        - FAILED

    FinalityStatus:
      type: string
      description: |
        Finality tier reached on-chain. Same enumeration as the Instruction API.
      enum:
        - PENDING
        - PROBABILISTIC
        - FINAL

    BridgePreference:
      type: string
      description: |
        Optional preference expressed by the instructing party. The VASP
        selects the actual bridge protocol and route, but uses the
        preference to inform its choice.
      enum:
        - OPTIMISE_COST
        - OPTIMISE_TIME
        - OPTIMISE_FINALITY

    LimitBasis:
      type: string
      enum:
        - OPERATIONAL
        - REGULATORY
        - RISK

    LimitPeriod:
      type: string
      enum:
        - PER_TRANSACTION
        - DAILY
        - WEEKLY
        - MONTHLY
        - CUMULATIVE

    # ── WALLET-TO-WALLET TRANSFER ────────────────────────────────────────────

    WalletReference:
      type: object
      description: |
        Reference to a wallet under the legal account holder's control.
        Uses CashAccount40 conventions consistent with the rest of the family.
      required: [proxy, chain_dli]
      properties:
        proxy:
          type: object
          required: [type, identification]
          properties:
            type:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [EWAL]
                  description: |
                    EWAL = Electronic Wallet. Same convention as the rest of
                    the pacs.crypto family.
            identification:
              type: string
              description: The blockchain wallet address string.
        chain_dli:
          type: string
          description: |
            Chain identifier. ISO 24165-2 Digital Ledger Identifier.
        label:
          type: string
          maxLength: 70
          description: |
            Optional internal label for the wallet (e.g. "Treasury hot wallet",
            "Settlement bank reserve").

    WalletTransfer:
      type: object
      description: |
        Own-account wallet-to-wallet transfer. Root object for
        `POST /wallet-transfer`.
      required:
        - transfer_reference
        - account_holder
        - source_wallet
        - destination_wallet
        - amount
        - token
      properties:
        transfer_reference:
          type: string
          maxLength: 35
          description: |
            Idempotency key. Assigned by the instructing party. Maps
            conceptually to the camt.050 `MsgId` / `TxId` pair.

        account_holder:
          type: object
          description: |
            Identification of the legal account holder. Same identity
            applies to both source and destination wallets.
          required: [name]
          properties:
            name:
              type: string
              maxLength: 140
            lei:
              type: string
              pattern: '^[A-Z0-9]{20}$'
            internal_reference:
              type: string
              maxLength: 35
              description: |
                Internal customer reference at the VASP, where the VASP
                segregates by customer rather than by LEI.

        source_wallet:
          $ref: '#/components/schemas/WalletReference'

        destination_wallet:
          $ref: '#/components/schemas/WalletReference'

        amount:
          type: object
          required: [value, currency]
          description: |
            Transfer amount in the source token. Follows the pacs.crypto
            family currency convention.
          properties:
            value:
              type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
              description: Decimal value as string (preserves token precision).
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
              description: |
                ISO 4217 currency code of the underlying fiat for pegged
                stablecoins (USD for USDC, EUR for EURC, and so on). Use
                `XXX` (ISO 4217 "no currency involved") for tokens not pegged
                to a fiat currency such as ETH, BTC, or governance tokens.
                The specific token is identified in `token.token_dti`.

        token:
          type: object
          description: |
            Token specification. Same shape as the Instruction API to ensure
            cross-API consistency. The `token_dti` identifies the source-chain
            token being moved. For cross-chain transfers, the destination-side
            token representation is selected by the VASP and reported back in
            the transfer detail.
          required: [token_dti]
          properties:
            token_dti:
              type: string
              description: ISO 24165-1 Digital Token Identifier of the source token.
            chain_dli:
              type: string
              description: Issuance chain of the token.
            token_symbol:
              type: string
              maxLength: 8
            token_standard:
              type: string
              maxLength: 35

        initiating_ai_agent:
          $ref: '#/components/schemas/InitiatingAIAgent'
          description: |
            [EXTENSION — v1.4] Present when an AI agent initiated this liquidity
            transfer. Requires MANAGE_LIQUIDITY scope in the agent's mandate (and is
            bounded by that action class's constraints, e.g. max_transfer_amount,
            allowed_accounts). Omit for human-initiated transfers.
        purpose:
          type: string
          maxLength: 35
          description: |
            Optional free-text description of the operational purpose of the
            transfer. Used for internal audit and reconciliation only.

        execution_timing:
          type: string
          enum: [IMMEDIATE, NEXT_BLOCK_WINDOW, BATCHED]
          default: IMMEDIATE
          description: |
            Operational guidance for the executing VASP. Most internal moves
            are IMMEDIATE.

        # ── Cross-chain specific fields ──────────────────────────────────
        bridge_preference:
          $ref: '#/components/schemas/BridgePreference'

        maximum_slippage_rate:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            Optional cap on bridge-leg slippage, expressed as a rate (e.g.
            "0.003" = 0.3%). Applicable to cross-chain transfers where
            bridge mechanisms may introduce slippage. The VASP must reject
            the transfer with a `SLIPPAGE_EXCEEDED` failure if the actual
            slippage would exceed this cap.

        expiry_date_time:
          type: string
          format: date-time
          description: |
            Optional latest acceptable execution time. After this, the
            transfer is rejected with `EXPIRED`.

    WalletTransferResponse:
      type: object
      required: [transfer_id, status, accepted_at]
      properties:
        transfer_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TransferStatus'
        accepted_at:
          type: string
          format: date-time
        estimated_completion:
          type: string
          format: date-time
          description: |
            VASP's best estimate of the time by which the transfer will reach
            FINAL status. For cross-chain transfers, depends on the bridge
            protocol selected. Implementations should not rely on this
            timestamp as a guarantee.
        bridge_protocol:
          type: string
          maxLength: 70
          description: |
            For cross-chain transfers, the bridge protocol selected by the
            VASP. Empty for same-chain transfers.
        destination_token:
          type: object
          description: |
            For cross-chain transfers, the destination-chain token
            representation that will be credited. May differ from the
            source-chain `token` in the request: the source-chain token
            is converted through the bridge into the destination-chain
            representation, which may be a canonical, bridged, or wrapped
            variant. The instructing party should verify this matches
            operational expectations before treating the transfer as
            complete.
          properties:
            token_dti:
              type: string
              description: DTI of the destination-chain token.
            token_symbol:
              type: string
              maxLength: 8
            chain_dli:
              type: string
            representation:
              type: string
              enum: [CANONICAL, BRIDGED, WRAPPED]
              description: |
                Indicates whether the destination token is the canonical
                issuance on the destination chain, a bridged representation
                from another chain, or a wrapped variant.
        estimated_bridge_cost:
          type: object
          description: |
            VASP's best estimate of the bridge-leg cost at submission time.
            Actual cost is reported in the transfer detail after settlement.
          properties:
            value:
              type: string
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
              description: |
                ISO 4217 currency code. Use `XXX` for non-pegged tokens with
                the specific asset identified by `token_dti`.
            token_dti:
              type: string
              description: DTI of the token in which the cost is denominated.

    WalletTransferDetail:
      type: object
      properties:
        transfer_id:
          type: string
          format: uuid
        transfer_reference:
          type: string
        status:
          $ref: '#/components/schemas/TransferStatus'
        status_detail:
          type: string
          maxLength: 280
          description: |
            Free-text status detail. Particularly relevant for `BRIDGE_STUCK`
            and `FAILED` statuses where the cause and any recovery path
            should be explained.
        finality_status:
          $ref: '#/components/schemas/FinalityStatus'
        confirmation_depth:
          type: integer
        original_request:
          $ref: '#/components/schemas/WalletTransfer'
        destination_token:
          type: object
          description: |
            Destination-chain token representation that was actually credited.
            For same-chain transfers, identical to the source token.
          properties:
            token_dti:
              type: string
            token_symbol:
              type: string
              maxLength: 8
            chain_dli:
              type: string
            representation:
              type: string
              enum: [CANONICAL, BRIDGED, WRAPPED]
        on_chain_settlement_evidence:
          type: object
          description: |
            For same-chain transfers, a single transaction hash on the
            source chain. For cross-chain transfers, separate source-chain
            and destination-chain transaction hashes plus the bridge
            protocol detail and the actual bridge leg cost.
          properties:
            source_chain_tx_hash:
              type: string
            destination_chain_tx_hash:
              type: string
            bridge_protocol:
              type: string
              maxLength: 70
            actual_bridge_cost:
              type: object
              properties:
                value:
                  type: string
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                  description: |
                    ISO 4217 currency code per family convention.
                token_dti:
                  type: string
            actual_slippage_rate:
              type: string
              description: |
                Realised slippage on the bridge leg, expressed as a rate
                (e.g. "0.0021" = 0.21%). Computed as
                `(amount_credited_destination - amount_debited_source) / amount_debited_source`,
                with bridge fees excluded from the numerator (they are
                reported separately in `actual_bridge_cost`).
            elapsed_seconds:
              type: integer

    WalletTransferSearchResponse:
      type: object
      description: |
        Paginated search results. Cursor-based pagination: subsequent pages
        are requested by passing the `next_cursor` value as the `cursor`
        query parameter on the next call. Cursors are valid for 24 hours.
      properties:
        page_size:
          type: integer
        next_cursor:
          type: string
          description: |
            Opaque cursor token for the next page. Absent when there are no
            further pages.
        total_count_estimate:
          type: integer
          description: |
            Estimated total count across all pages.
        results:
          type: array
          items:
            type: object
            properties:
              transfer_id:
                type: string
                format: uuid
              transfer_reference:
                type: string
              status:
                $ref: '#/components/schemas/TransferStatus'
              source_wallet:
                type: string
              destination_wallet:
                type: string
              value:
                type: string
                description: Decimal value as string.
              currency:
                type: string
                pattern: '^[A-Z]{3}$'
                description: |
                  ISO 4217 currency code per family convention.
              token_dti:
                type: string
              created_at:
                type: string
                format: date-time

    # ── WALLET POSITION ──────────────────────────────────────────────────────

    WalletPosition:
      type: object
      properties:
        wallet:
          $ref: '#/components/schemas/WalletReference'
        as_of:
          type: string
          format: date-time
        balances:
          type: array
          items:
            type: object
            properties:
              token_dti:
                type: string
              token_symbol:
                type: string
              current_balance:
                type: string
                description: |
                  Booked balance reflecting confirmed on-chain state at the
                  VASP's last reconciliation point.
              available_balance:
                type: string
                description: |
                  Current balance minus pending outbound transfers minus any
                  operational holds applied by the VASP. The exact rules for
                  operational holds are implementation-dependent; the
                  `holds_detail` array enumerates any non-zero contributions
                  to the difference between `current_balance` and
                  `available_balance`.
              pending_inbound:
                type: string
                description: Sum of accepted but not yet finalised inbound transfers.
              pending_outbound:
                type: string
                description: Sum of accepted but not yet finalised outbound transfers.
              holds_detail:
                type: array
                description: |
                  Non-zero operational holds contributing to the difference
                  between current_balance and available_balance. Hold types
                  are implementation-dependent and bilaterally documented.
                items:
                  type: object
                  properties:
                    hold_type:
                      type: string
                      maxLength: 70
                      description: |
                        Implementation-specific hold category, for example
                        STAKED, LENT_DEFI, OPERATIONAL_REVIEW, QUEUED_TRANSFER.
                    value:
                      type: string
                    description:
                      type: string
                      maxLength: 280
                    release_estimate:
                      type: string
                      format: date-time
                      description: |
                        Expected release time for the hold, where known.

    WalletPositionResponse:
      type: object
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/WalletPosition'

    # ── WALLET LIMIT ─────────────────────────────────────────────────────────

    WalletLimit:
      type: object
      properties:
        limit_id:
          type: string
          format: uuid
        wallet:
          $ref: '#/components/schemas/WalletReference'
        basis:
          $ref: '#/components/schemas/LimitBasis'
        period:
          $ref: '#/components/schemas/LimitPeriod'
        token_dti:
          type: string
          description: |
            Token to which the limit applies. Optional — if omitted, the
            limit applies in aggregate value terms (typically denominated
            in a reporting currency).
        reporting_currency:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: string
          description: Limit amount.
        consumed:
          type: string
          description: |
            Amount consumed in the current period. Resets at period boundary.
        available:
          type: string
          description: |
            Remaining headroom in the current period (amount minus consumed).
        next_reset:
          type: string
          format: date-time
        description:
          type: string
          maxLength: 280

    WalletLimitResponse:
      type: object
      properties:
        wallet:
          $ref: '#/components/schemas/WalletReference'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/WalletLimit'

    WalletLimitAmendment:
      type: object
      required: [limit_id, new_amount, requestor]
      properties:
        limit_id:
          type: string
          format: uuid
        new_amount:
          type: string
        effective_from:
          type: string
          format: date-time
        requestor:
          type: object
          required: [name]
          properties:
            name:
              type: string
              maxLength: 140
            lei:
              type: string
              pattern: '^[A-Z0-9]{20}$'
        initiating_ai_agent:
          $ref: '#/components/schemas/InitiatingAIAgent'
          description: |
            [EXTENSION — v1.4] Present when an AI agent initiated this limit amendment.
            Requires AMEND_LIMIT scope; the mandate's max_limit_ceiling caps how high
            the agent may set the limit. Omit for human-initiated amendments.
        justification:
          type: string
          maxLength: 1000

    WalletLimitAmendmentResponse:
      type: object
      properties:
        amendment_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPLIED, PENDING_APPROVAL, REJECTED]
        effective_from:
          type: string
          format: date-time
        rejection_reason:
          type: string

    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object

  examples:

    Example_SameChain_USDC:
      summary: Same-chain USDC liquidity move between two corporate wallets
      description: |
        Global Industries Plc moves 500,000 USDC from its treasury wallet on
        Ethereum to its operational wallet on the same chain. Both wallets
        are under the same legal entity. No Travel Rule applies. The
        execution is immediate.
      value:
        transfer_reference: "GI-LIQ-2026-05-22-001"
        account_holder:
          name: "Global Industries Plc"
          lei: "213800ABC123DEF45678"
        source_wallet:
          proxy:
            type:
              code: "EWAL"
            identification: "0x88f2B5A8b9C3D4E5F6A7B8C9D0E1F2A3B4C5D6E7"
          chain_dli: "X9J9XDMTD"
          label: "Treasury hot wallet"
        destination_wallet:
          proxy:
            type:
              code: "EWAL"
            identification: "0xAA77B8C9D0E1F2A3B4C5D6E78890F1A2B3C4D5E6"
          chain_dli: "X9J9XDMTD"
          label: "Operational settlement wallet"
        amount:
          value: "500000.000000"
          currency: "USD"
        token:
          token_dti: "T9B3X8H2K"
          chain_dli: "X9J9XDMTD"
          token_symbol: "USDC"
          token_standard: "ERC-20"
        purpose: "Operational rebalancing per treasury policy 2026-Q2"
        execution_timing: "IMMEDIATE"

    Example_CrossChain_USDC:
      summary: Cross-chain USDC move from Ethereum to Polygon via VASP-chosen bridge
      description: |
        Global Industries Plc moves 250,000 USDC from its Ethereum wallet to
        its Polygon wallet to support a Polygon-side operational programme.
        The VASP selects the bridge protocol. The corporate expresses a
        preference to optimise cost and bounds slippage at 0.3%.
      value:
        transfer_reference: "GI-LIQ-2026-05-22-002"
        account_holder:
          name: "Global Industries Plc"
          lei: "213800ABC123DEF45678"
        source_wallet:
          proxy:
            type:
              code: "EWAL"
            identification: "0x88f2B5A8b9C3D4E5F6A7B8C9D0E1F2A3B4C5D6E7"
          chain_dli: "X9J9XDMTD"
          label: "Ethereum treasury"
        destination_wallet:
          proxy:
            type:
              code: "EWAL"
            identification: "0xBB99C8D7E6F5A4B3C2D1E0F9A8B7C6D5E4F3A2B1"
          chain_dli: "T9B3X8H2K"
          label: "Polygon operational"
        amount:
          value: "250000.000000"
          currency: "USD"
        token:
          token_dti: "T9B3X8H2K"
          chain_dli: "X9J9XDMTD"
          token_symbol: "USDC"
          token_standard: "ERC-20"
        purpose: "Polygon programme funding"
        execution_timing: "IMMEDIATE"
        bridge_preference: "OPTIMISE_COST"
        maximum_slippage_rate: "0.003"
